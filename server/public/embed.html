<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live tips map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        height: 100%;
        background: #08111f;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .popup {
        min-width: 180px;
      }
      .popup img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        border-radius: 8px;
        display: block;
        margin-bottom: 8px;
        background: #162744;
      }
      .popup strong {
        display: block;
        margin-bottom: 4px;
      }
      .popup span {
        color: #5c6b80;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const focus = params.get('focus');
      const pickMode = params.get('mode') === 'pick';
      const map = L.map('map', { zoomControl: true }).setView([39.5, -98.3], 4);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap, &copy; CARTO',
        maxZoom: 19,
      }).addTo(map);

      const markers = L.layerGroup().addTo(map);

      function pinColor(status) {
        if (status === 'forwarded') return '#3DDC97';
        if (status === 'reviewing') return '#E8A317';
        if (status === 'closed') return '#A8B4C8';
        return '#D7263D';
      }

      function addReports(reports) {
        markers.clearLayers();
        let focused = null;
        reports.forEach((report) => {
          const marker = L.circleMarker([report.latitude, report.longitude], {
            radius: 9,
            color: '#08111F',
            weight: 2,
            fillColor: pinColor(report.status),
            fillOpacity: 1,
          });
          const photo = report.photos[0];
          marker.bindPopup(
            `<div class="popup">${
              photo ? `<img src="${photo.url}" alt="" />` : ''
            }<strong>${report.locationLabel || 'Highway tip'}</strong><span>${report.status} · ${
              report.observation || report.vehicles || 'Photo on file'
            }</span></div>`,
          );
          marker.on('click', () => {
            window.parent.postMessage({ type: 'open-report', id: report.id }, '*');
          });
          marker.addTo(markers);
          if (focus && report.id === focus) {
            focused = marker;
          }
        });
        if (focused) {
          focused.openPopup();
          map.setView(focused.getLatLng(), 11);
        }
      }

      async function refresh() {
        const response = await fetch('/api/reports');
        const payload = await response.json();
        addReports(payload.reports || []);
      }

      map.on('click', (event) => {
        if (!pickMode) {
          return;
        }
        window.parent.postMessage(
          { type: 'map-pick', latitude: event.latlng.lat, longitude: event.latlng.lng },
          '*',
        );
      });

      refresh();
      setInterval(refresh, 4000);
    </script>
  </body>
</html>
